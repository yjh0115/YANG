name: Browser Preview Package

on:
  # A workflow introduced by a PR is not yet present on the default branch, so
  # the push trigger bootstraps the first preview run for that work branch.
  push:
    branches-ignore: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Create browser preview
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build a self-contained preview
        run: |
          mkdir -p preview-package
          python3 - <<'PY'
          from pathlib import Path

          html = Path('index.html').read_text()
          css = Path('styles.css').read_text()
          js = Path('app.js').read_text()
          html = html.replace(
              '<link rel="stylesheet" href="styles.css">',
              f'<style>\n{css}\n</style>',
          )
          html = html.replace(
              '<script src="app.js"></script>',
              f'<script>\n{js}\n</script>',
          )
          Path('preview-package/quad-lab-preview.html').write_text(html)
          PY
          cp index.html styles.css app.js preview-package/

      - name: Upload preview package
        id: upload
        uses: actions/upload-artifact@v4
        with:
          # run_id keeps bootstrap push artifacts uniquely identifiable before
          # this workflow itself reaches the default branch.
          name: quad-lab-preview-${{ github.run_id }}
          path: preview-package/
          retention-days: 7

      - name: Add preview instructions to the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        with:
          script: |
            const marker = '<!-- quad-lab-preview-package -->';
            const body = `${marker}
            ## 🔎 QUAD LAB 브라우저 Preview

            외부 서비스나 Secret 없이 GitHub가 만든 Preview 파일입니다.

            1. [Preview 다운로드](${process.env.ARTIFACT_URL})를 클릭합니다.
            2. 내려받은 ZIP 파일의 압축을 풉니다.
            3. \`quad-lab-preview.html\`을 더블 클릭해 브라우저에서 확인합니다.

            새 커밋이 올라오면 이 링크는 최신 실행의 Preview로 자동 교체됩니다.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(comment => comment.user.type === 'Bot' && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Write workflow summary
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo '## QUAD LAB 브라우저 Preview'
            echo
            echo "[Preview ZIP 다운로드]($ARTIFACT_URL)"
            echo
            echo '압축을 푼 뒤 `quad-lab-preview.html`을 더블 클릭하세요.'
          } >> "$GITHUB_STEP_SUMMARY"
