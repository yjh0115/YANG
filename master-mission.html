<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>사각형 마스터 도전 · QUAD LAB</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="refresh.css"><style>main{max-width:850px;margin:35px auto;padding:0 18px 65px}.intro{text-align:center}.intro p{color:#665d79}.question{background:white;border:2px solid #e8def1;border-radius:23px;padding:23px;margin:20px 0}.question h2{font-size:19px;line-height:1.6}.options{display:grid;gap:9px}.options label{display:flex;gap:12px;align-items:flex-start;border:1px solid #e7dff0;border-radius:13px;padding:12px;cursor:pointer}.options label:has(input:checked){background:#f0eaff;border-color:#7958d4}.options input{margin-top:5px;accent-color:#7652ca}.explain{display:none;margin-top:14px;padding:13px;background:#f0f9ef;border-radius:12px}.question.wrong .explain{background:#fff1dc}.question.checked .explain{display:block}.status{font-weight:800}.question.correct .status{color:#16804b}.question.wrong .status{color:#986000}.actions{display:flex;gap:12px;flex-wrap:wrap}.result{font-size:20px;font-weight:900;padding:18px;background:#efe9ff;border-radius:17px;margin-top:18px}.diagram{display:block;max-width:320px;width:100%;margin:8px auto}.diagram text{font-size:17px;font-weight:800;fill:#41356e}</style></head><body><header class="topbar"><a class="brand" href="index.html" style="text-decoration:none"><span class="brand-mark">◇</span>QUAD LAB ✨</a></header><main><a href="index.html">← 학습 목록으로</a><div class="intro"><h1>🏆 사각형 마스터 도전</h1><p>성질 → 조건 → 포함 관계 → 여러 조건을 연결하는 10문제! 각 문항의 답을 고르고 채점해 보세요.</p></div><form id="mission"></form><div class="actions"><button class="primary" id="grade">10문제 채점하기 🎉</button><button class="secondary" id="retry">다시 풀기 ↻</button><a class="secondary" href="relation-map.html" style="text-decoration:none">관계 지도 복습 🧩</a></div><div id="result" class="result" role="status" aria-live="polite" hidden></div></main><script>const seg=s=>`<span class="seg">${s}</span>`;const diagram=`<svg class="diagram" viewBox="0 0 320 210" role="img" aria-label="꼭짓점 A는 왼쪽 위, B는 왼쪽 아래, C는 오른쪽 아래, D는 오른쪽 위에 있는 평행사변형 ABCD. 대각선 AC와 BD의 교점은 O"><path d="M65 35L30 175L245 175L280 35Z" fill="#f1eaff" stroke="#7352b7" stroke-width="3"/><path d="M65 35L245 175M30 175L280 35" stroke="#db83a3" stroke-width="2" stroke-dasharray="5 4"/><g><text x="45" y="27">A</text><text x="10" y="193">B</text><text x="249" y="193">C</text><text x="285" y="28">D</text><text x="151" y="110">O</text></g></svg>`;const questions=[{q:'평행사변형 ABCD에서 반드시 같은 길이인 선분의 쌍은?',o:[`${seg('AB')}와 ${seg('BC')}`,`${seg('AB')}와 ${seg('CD')}`,`${seg('AC')}와 ${seg('BD')}`],a:1,e:'평행사변형은 마주 보는 두 변의 길이가 각각 같습니다.'},{q:'평행사변형 ABCD의 대각선이 O에서 만날 때 항상 성립하는 것은?',o:[`${seg('AO')} = ${seg('OC')}`,`${seg('AO')} = ${seg('BO')}`,`${seg('AC')} ⟂ ${seg('BD')}`],a:0,e:'평행사변형의 두 대각선은 서로를 이등분합니다.',d:diagram},{q:'사각형 ABCD가 반드시 평행사변형이 되는 조건은?',o:['한 쌍의 대변만 평행하다.','두 대각선의 길이가 같다.','두 대각선이 서로를 이등분한다.'],a:2,e:'두 대각선이 서로를 이등분하면 평행사변형이 되는 충분한 조건입니다.'},{q:'평행사변형에서 한 내각이 90°라면 어떤 도형이라고 확정할 수 있을까요?',o:['직사각형','마름모','정사각형'],a:0,e:'평행사변형은 이웃한 두 각의 합이 180°이고 마주 보는 각이 같으므로 네 각이 모두 직각입니다.'},{q:'평행사변형의 두 대각선이 서로 수직이라면 어떤 도형이라고 확정할 수 있을까요?',o:['직사각형','마름모','정사각형'],a:1,e:'평행사변형에서 두 대각선이 수직이면 네 변의 길이가 같아 마름모입니다. 정사각형이라고는 확정할 수 없습니다.'},{q:'직사각형 ABCD에서 항상 옳은 대각선 성질은?',o:['두 대각선은 길이가 같고 서로를 이등분한다.','두 대각선은 반드시 서로 수직이다.','두 대각선은 서로 평행하다.'],a:0,e:'직사각형은 평행사변형이므로 대각선이 서로를 이등분하고, 두 대각선의 길이도 같습니다.'},{q:'마름모가 정사각형이 되기 위해 추가로 필요한 조건은?',o:['마주 보는 두 변이 평행하다.','두 대각선이 서로 수직이다.','두 대각선의 길이가 같다.'],a:2,e:'마름모는 이미 대각선이 서로 수직입니다. 길이까지 같으면 정사각형입니다.'},{q:'다음 포함 관계 중 항상 옳은 설명은? (사다리꼴은 한 쌍 이상의 대변이 평행한 사각형으로 정의)',o:['모든 직사각형은 정사각형이다.','모든 정사각형은 사다리꼴이다.','모든 마름모는 직사각형이다.'],a:1,e:'정사각형은 평행사변형이고 적어도 한 쌍의 대변이 평행하므로, 이 학습에서 사용하는 포함적 정의에 따라 사다리꼴입니다.'},{q:'평행사변형의 두 대각선의 길이가 같고 서로 수직입니다. 어떤 도형이라고 확정할 수 있을까요?',o:['직사각형만 확정할 수 있다.','마름모만 확정할 수 있다.','정사각형이라고 확정할 수 있다.'],a:2,e:'대각선 길이가 같으므로 직사각형, 서로 수직이므로 마름모입니다. 두 조건을 함께 만족하는 평행사변형은 정사각형입니다.'},{q:'학생이 “두 대각선의 길이가 같으면 무조건 직사각형이다”라고 말했습니다. 가장 알맞은 설명은?',o:['맞다. 모든 사각형에서 성립한다.','틀리다. 평행사변형이라는 조건이 추가되어야 직사각형이라고 확정할 수 있다.','틀리다. 두 대각선의 길이가 같으면 반드시 마름모다.'],a:1,e:'일반 사각형에서는 대각선 길이가 같다는 사실만으로 직사각형이라고 할 수 없습니다. 평행사변형이라는 전제가 필요합니다.'}];const form=document.querySelector('#mission');form.innerHTML=questions.map((x,i)=>`<section class="question" id="q${i}"><h2>${i+1}. ${x.q}</h2>${x.d||''}<div class="options">${x.o.map((v,j)=>`<label><input type="radio" name="q${i}" value="${j}"><span>${v}</span></label>`).join('')}</div><div class="explain"><div class="status"></div><div>${x.e}</div></div></section>`).join('');document.querySelector('#grade').onclick=()=>{let score=0;questions.forEach((x,i)=>{const section=document.querySelector('#q'+i);const value=form.querySelector(`input[name=q${i}]:checked`)?.value;const ok=Number(value)===x.a&&value!==undefined;score+=Number(ok);section.classList.remove('correct','wrong');section.classList.add('checked',ok?'correct':'wrong');section.querySelector('.status').textContent=ok?'🎉 정답입니다!':'💪 다시 살펴봐요. 정답: '+x.o[x.a]});const result=document.querySelector('#result');result.hidden=false;result.textContent=`${score}/10점 · ${score===10?'완벽해요! 사각형 마스터 달성! 🌟':'해설을 읽고 틀린 조건을 다시 확인해 보세요. ✨'}`;result.scrollIntoView({behavior:'smooth',block:'center'})};document.querySelector('#retry').onclick=()=>{form.reset();document.querySelectorAll('.question').forEach(q=>q.classList.remove('checked','correct','wrong'));document.querySelector('#result').hidden=true;window.scrollTo({top:0,behavior:'smooth'})};</script><script src="learning-flow.js"></script></body></html>
